# TEMPLATE: copy to <repository>/.github/workflows/build-android.yml manually.
# This template only builds a debug APK after workflow_dispatch; it does not publish.
name: Build Android debug APK

on:
  workflow_dispatch:
    inputs:
      android_directory:
        description: Android project directory relative to repository root
        required: true
        default: android
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install fixed SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up fixed Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Copy mobile web assets
        working-directory: ${{ inputs.android_directory }}
        run: |
          test -f ../web/index.html
          mkdir -p app/src/main/assets/web
          cp -R ../web/. app/src/main/assets/web/
      - name: Assemble and lint packaged web app
        working-directory: ${{ inputs.android_directory }}
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: Upload debug APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: jiangshan-android-debug
          if-no-files-found: error
          path: |
            ${{ inputs.android_directory }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ inputs.android_directory }}/app/build/reports/lint-results-debug.html
