plugins {
    id 'com.android.application'
}

android {
    namespace 'org.jiangshan.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'org.jiangshan.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Fail clearly instead of packaging an empty shell. The parent project supplies
// the final mobile web build; no placeholder HTML is shipped here.
tasks.register('verifyWebAssets') {
    doLast {
        if (!file('src/main/assets/web/index.html').isFile()) {
            throw new GradleException('Missing assets/web/index.html. Copy the mobile web build into app/src/main/assets/web/ first; see README.md.')
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyWebAssets')
}
